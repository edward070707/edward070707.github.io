<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memive Admin — Notifiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080F;
  --card:#0F0F1E;
  --border:rgba(255,255,255,.07);
  --indigo:#4338CA;
  --violet:#7C3AED;
  --pink:#EC4899;
  --cyan:#00F5D4;
  --text:#E8E8F0;
  --text2:#8BA0CC;
  --text3:#4A5568;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}

/* Aurora */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(67,56,202,.18), transparent),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(236,72,153,.10), transparent)}

/* Layout */
.wrap{max-width:860px;margin:0 auto;padding:40px 24px;position:relative;z-index:1}

/* Header */
.hdr{display:flex;align-items:center;gap:16px;margin-bottom:48px;border-bottom:1px solid var(--border);padding-bottom:24px}
.hdr-logo svg{display:block}
.hdr-text h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#6366F1,#8B5CF6,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-text p{font-size:12px;color:var(--text3);margin-top:2px;font-family:'Space Mono',monospace}
.hdr-badge{margin-left:auto;padding:6px 14px;background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.25);border-radius:20px;font-size:11px;font-weight:600;color:#F472B6;font-family:'Space Mono',monospace;letter-spacing:.06em}

/* Section title */
.sec-title{font-size:13px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;font-family:'Space Mono',monospace;margin-bottom:16px}

/* Form card */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:32px}
.card-title{font-size:18px;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px}

/* Form fields */
.field{margin-bottom:20px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;letter-spacing:.04em}
.field input, .field textarea, .field select{
  width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;color:var(--text);font-family:'Inter',sans-serif;
  font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;resize:vertical}
.field input:focus, .field textarea:focus, .field select:focus{
  border-color:rgba(99,102,241,.5);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.field textarea{min-height:90px}
.field select option{background:#1a1a2e}

/* Target pills */
.target-row{display:flex;gap:8px;flex-wrap:wrap}
.target-pill{padding:8px 16px;border:1px solid var(--border);border-radius:20px;font-size:12px;
  font-weight:600;cursor:pointer;transition:all .2s;background:transparent;color:var(--text2)}
.target-pill.active{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.5);color:#A5B4FC}
.target-pill input{display:none}

/* Type chips */
.type-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.type-chip{display:flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--border);
  border-radius:12px;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.02)}
.type-chip:hover{background:rgba(255,255,255,.05)}
.type-chip.active{background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.4)}
.type-chip .chip-icon{font-size:18px}
.type-chip .chip-label{font-size:12px;font-weight:600;color:var(--text2)}
.type-chip.active .chip-label{color:#A5B4FC}

/* Char counter */
.field-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.char-count{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace}
.char-count.warn{color:#FBBF24}
.char-count.err{color:#F87171}

/* Send button */
.btn-send{width:100%;padding:16px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,#4338CA,#7C3AED,#EC4899);
  background-size:200% 200%;animation:grad 4s ease infinite;
  font-size:16px;font-weight:700;color:#fff;letter-spacing:.04em;
  transition:opacity .2s,transform .15s,box-shadow .2s;
  box-shadow:0 4px 24px rgba(124,58,237,.35)}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn-send:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(124,58,237,.5)}
.btn-send:active{transform:translateY(0)}
.btn-send:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Preview card */
.preview-card{background:rgba(255,255,255,.025);border:1px solid rgba(99,102,241,.2);border-radius:16px;padding:16px 20px;margin-bottom:24px;display:none}
.preview-card.visible{display:block}
.preview-app-name{font-size:10px;font-weight:700;color:var(--violet);letter-spacing:.1em;font-family:'Space Mono',monospace;margin-bottom:6px}
.preview-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.preview-body{font-size:13px;color:var(--text2);line-height:1.5}

/* History table */
.history-table{width:100%;border-collapse:collapse}
.history-table th{text-align:left;font-size:11px;font-weight:600;color:var(--text3);
  letter-spacing:.08em;padding:0 12px 12px;font-family:'Space Mono',monospace;border-bottom:1px solid var(--border)}
.history-table td{padding:14px 12px;font-size:13px;color:var(--text2);border-bottom:1px solid rgba(255,255,255,.03)}
.history-table tr:last-child td{border-bottom:none}
.history-table .notif-title-cell{color:var(--text);font-weight:600;max-width:200px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
  border-radius:20px;font-size:10px;font-weight:700;font-family:'Space Mono',monospace}
.status-badge.sent{background:rgba(0,245,212,.1);color:#00F5D4;border:1px solid rgba(0,245,212,.2)}
.status-badge.pending{background:rgba(251,191,36,.08);color:#FBBF24;border:1px solid rgba(251,191,36,.2)}
.status-badge.failed{background:rgba(248,113,113,.08);color:#F87171;border:1px solid rgba(248,113,113,.2)}

/* Toast */
#toast{position:fixed;bottom:32px;right:32px;z-index:999;padding:14px 22px;border-radius:14px;
  font-size:13px;font-weight:600;color:#fff;opacity:0;transform:translateY(12px);
  transition:all .3s;pointer-events:none;max-width:320px}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{background:linear-gradient(135deg,rgba(0,245,212,.9),rgba(5,150,105,.95));box-shadow:0 8px 24px rgba(0,245,212,.3)}
#toast.error{background:linear-gradient(135deg,rgba(248,113,113,.95),rgba(220,38,38,.9));box-shadow:0 8px 24px rgba(248,113,113,.3)}
#toast.info{background:linear-gradient(135deg,rgba(99,102,241,.95),rgba(124,58,237,.9));box-shadow:0 8px 24px rgba(99,102,241,.3)}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 24px}
.stat-num{font-size:28px;font-weight:700;background:linear-gradient(135deg,#6366F1,#EC4899);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--text3)}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}

@media(max-width:600px){
  .stats-row{grid-template-columns:1fr}
  .type-row{flex-direction:column}
  .target-row{flex-direction:column}
}
</style>
</head>
<body>
<div class="aurora"></div>

<div class="wrap">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-logo">
      <svg width="40" height="40" viewBox="0 0 90 90" fill="none">
        <defs>
          <linearGradient id="admin-lg" x1="14" y1="65" x2="76" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="50%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#EC4899"/>
          </linearGradient>
        </defs>
        <path d="M14 65 L14 30 Q14 22 22 22 Q28 22 30 30 L45 55 L60 30 Q62 22 68 22 Q76 22 76 30 L76 65"
              stroke="url(#admin-lg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="45" cy="76" r="4" fill="url(#admin-lg)"/>
      </svg>
    </div>
    <div class="hdr-text">
      <h1>Memive Admin</h1>
      <p>Pannello notifiche push</p>
    </div>
    <div class="hdr-badge" id="conn-badge">⬤ Connessione...</div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-total">—</div>
      <div class="stat-label">Notifiche inviate</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-users">—</div>
      <div class="stat-label">Utenti attivi</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-today">—</div>
      <div class="stat-label">Oggi</div>
    </div>
  </div>

  <!-- Compose form -->
  <div class="card">
    <div class="card-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Nuova notifica
    </div>

    <!-- Tipo notifica -->
    <div class="field">
      <label>TIPO</label>
      <div class="type-row">
        <div class="type-chip active" onclick="selectType(this,'announcement')">
          <span class="chip-icon">📢</span><span class="chip-label">Annuncio</span>
        </div>
        <div class="type-chip" onclick="selectType(this,'feature')">
          <span class="chip-icon">✨</span><span class="chip-label">Nuova feature</span>
        </div>
        <div class="type-chip" onclick="selectType(this,'challenge')">
          <span class="chip-icon">🏆</span><span class="chip-label">Challenge</span>
        </div>
        <div class="type-chip" onclick="selectType(this,'maintenance')">
          <span class="chip-icon">🛠</span><span class="chip-label">Manutenzione</span>
        </div>
        <div class="type-chip" onclick="selectType(this,'promo')">
          <span class="chip-icon">🎁</span><span class="chip-label">Promo</span>
        </div>
      </div>
    </div>

    <!-- Titolo -->
    <div class="field">
      <label>TITOLO <span style="color:var(--pink)">*</span></label>
      <input type="text" id="f-title" maxlength="80" placeholder="es. Novità su Memive 🎙"
             oninput="updatePreview();updateCount('f-title',80,'tc')">
      <div class="field-meta">
        <span></span><span class="char-count" id="tc">0 / 80</span>
      </div>
    </div>

    <!-- Corpo -->
    <div class="field">
      <label>MESSAGGIO <span style="color:var(--pink)">*</span></label>
      <textarea id="f-body" maxlength="240" placeholder="Scrivi il messaggio della notifica..."
                oninput="updatePreview();updateCount('f-body',240,'bc')"></textarea>
      <div class="field-meta">
        <span></span><span class="char-count" id="bc">0 / 240</span>
      </div>
    </div>

    <!-- URL / deep link -->
    <div class="field">
      <label>DEEP LINK <span style="color:var(--text3)">(opzionale)</span></label>
      <input type="text" id="f-link" placeholder="es. memive://feed o https://memive.app">
    </div>

    <!-- Target -->
    <div class="field">
      <label>DESTINATARI</label>
      <div class="target-row" id="target-row">
        <label class="target-pill active"><input type="radio" name="target" value="all" checked onchange="selectTarget(this)"> 🌍 Tutti</label>
        <label class="target-pill"><input type="radio" name="target" value="free" onchange="selectTarget(this)"> 🆓 Solo Free</label>
        <label class="target-pill"><input type="radio" name="target" value="premium" onchange="selectTarget(this)"> ⭐ Solo Premium</label>
        <label class="target-pill"><input type="radio" name="target" value="ios" onchange="selectTarget(this)"> 🍎 Solo iOS</label>
        <label class="target-pill"><input type="radio" name="target" value="android" onchange="selectTarget(this)"> 🤖 Solo Android</label>
      </div>
    </div>

    <!-- Anteprima -->
    <div class="field">
      <label>ANTEPRIMA</label>
      <div class="preview-card" id="preview-card">
        <div class="preview-app-name">MEMIVE</div>
        <div class="preview-title" id="prev-title">—</div>
        <div class="preview-body" id="prev-body">—</div>
      </div>
    </div>

    <!-- Schedule (opzionale) -->
    <div class="field">
      <label>PROGRAMMAZIONE <span style="color:var(--text3)">(opzionale — lascia vuoto per inviare ora)</span></label>
      <input type="datetime-local" id="f-schedule">
    </div>

    <button class="btn-send" id="btn-send" onclick="sendNotification()">
      Invia notifica 🚀
    </button>
  </div>

  <!-- History -->
  <div class="card">
    <div class="card-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#6366F1" stroke-width="2"/>
        <polyline points="12 6 12 12 16 14" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Storico notifiche
    </div>
    <table class="history-table">
      <thead>
        <tr>
          <th>TITOLO</th>
          <th>TIPO</th>
          <th>TARGET</th>
          <th>DATA</th>
          <th>STATO</th>
        </tr>
      </thead>
      <tbody id="history-body">
        <tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text3)">Caricamento storico...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, orderBy, query, limit, serverTimestamp, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInAnonymously, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

// ─── Firebase config ────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBkQHQaDUWynmGDH7oXTtpWQB87pPLqYlw",
  authDomain: "chrono-app-edd0b.firebaseapp.com",
  projectId: "chrono-app-edd0b",
  storageBucket: "chrono-app-edd0b.firebasestorage.app",
  messagingSenderId: "373411392958",
  appId: "1:373411392958:web:f842da0f7ddb4949b39def",
  measurementId: "G-49MF780H9K"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ─── Auth ────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if(!user){
    try{
      await signInAnonymously(auth);
    } catch(e){
      document.getElementById('conn-badge').textContent = '⬤ Non connesso';
      document.getElementById('conn-badge').style.color = '#F87171';
    }
  } else {
    document.getElementById('conn-badge').textContent = '⬤ Connesso';
    document.getElementById('conn-badge').style.color = '#00F5D4';
    loadHistory();
    loadStats();
  }
});

// ─── Load stats ──────────────────────────────────────────────────────────────
async function loadStats(){
  try {
    const snap = await getDocs(collection(db, 'notifications'));
    document.getElementById('stat-total').textContent = snap.size;
    const today = new Date(); today.setHours(0,0,0,0);
    const todayCount = snap.docs.filter(d=>{
      const ts = d.data().createdAt?.toDate?.();
      return ts && ts >= today;
    }).length;
    document.getElementById('stat-today').textContent = todayCount;
    document.getElementById('stat-users').textContent = '—';
  } catch(e){ console.warn('Stats:', e); }
}

// ─── Load history ─────────────────────────────────────────────────────────────
async function loadHistory(){
  try {
    const q = query(collection(db,'notifications'), orderBy('createdAt','desc'), limit(20));
    const snap = await getDocs(q);
    const tbody = document.getElementById('history-body');
    if(snap.empty){ tbody.innerHTML='<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text3)">Nessuna notifica inviata</td></tr>'; return; }
    tbody.innerHTML = snap.docs.map(d=>{
      const n = d.data();
      const date = n.createdAt?.toDate?.()?.toLocaleDateString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) ?? '—';
      const statusMap = {sent:'sent',pending:'pending',failed:'failed'};
      const sc = statusMap[n.status] ?? 'pending';
      const sl = {sent:'✓ Inviata', pending:'⏳ Programmata', failed:'✗ Errore'}[sc] ?? sc;
      const typeEmoji = {announcement:'📢',feature:'✨',challenge:'🏆',maintenance:'🛠',promo:'🎁'}[n.type] ?? '📬';
      return `<tr>
        <td class="notif-title-cell">${escHtml(n.title||'')}</td>
        <td style="color:var(--text3)">${typeEmoji} ${n.type||'—'}</td>
        <td style="color:var(--text3)">${n.target||'all'}</td>
        <td style="color:var(--text3);white-space:nowrap">${date}</td>
        <td><span class="status-badge ${sc}">${sl}</span></td>
      </tr>`;
    }).join('');
  } catch(e){ console.error('History:', e); }
}

// ─── Send notification ────────────────────────────────────────────────────────
window.sendNotification = async function(){
  const title   = document.getElementById('f-title').value.trim();
  const body    = document.getElementById('f-body').value.trim();
  const link    = document.getElementById('f-link').value.trim();
  const target  = document.querySelector('input[name="target"]:checked')?.value || 'all';
  const sched   = document.getElementById('f-schedule').value;
  const type    = window._selectedType || 'announcement';

  if(!title){ showToast('Il titolo è obbligatorio','error'); return; }
  if(!body)  { showToast('Il messaggio è obbligatorio','error'); return; }

  const btn = document.getElementById('btn-send');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Invio in corso...';

  try {
    const payload = {
      title, body, type, target,
      link: link || null,
      status: sched ? 'pending' : 'sent',
      scheduledAt: sched ? Timestamp.fromDate(new Date(sched)) : null,
      createdAt: serverTimestamp(),
    };
    await addDoc(collection(db,'notifications'), payload);

    showToast(sched ? '⏳ Notifica programmata!' : '🚀 Notifica inviata con successo!', 'success');
    document.getElementById('f-title').value = '';
    document.getElementById('f-body').value = '';
    document.getElementById('f-link').value = '';
    document.getElementById('f-schedule').value = '';
    document.getElementById('preview-card').classList.remove('visible');
    updateCount('f-title',80,'tc');
    updateCount('f-body',240,'bc');
    await loadHistory();
    await loadStats();
  } catch(e){
    console.error(e);
    showToast('Errore: '+e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Invia notifica 🚀';
  }
};

function escHtml(s){ return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Make loadHistory accessible globally for manual refresh
window._loadHistory = loadHistory;
window._loadStats   = loadStats;
</script>

<script>
// ─── UI helpers (non-module) ──────────────────────────────────────────────────
window._selectedType = 'announcement';

function selectType(el, type){
  document.querySelectorAll('.type-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  window._selectedType = type;
}

function selectTarget(radio){
  document.querySelectorAll('.target-pill').forEach(p=>p.classList.remove('active'));
  radio.closest('.target-pill').classList.add('active');
}

function updateCount(fieldId, max, countId){
  const val = document.getElementById(fieldId).value.length;
  const el  = document.getElementById(countId);
  el.textContent = `${val} / ${max}`;
  el.className   = 'char-count' + (val > max*.9 ? (val>=max?' err':' warn'):'');
}

function updatePreview(){
  const t = document.getElementById('f-title').value.trim();
  const b = document.getElementById('f-body').value.trim();
  const card = document.getElementById('preview-card');
  if(t || b){
    card.classList.add('visible');
    document.getElementById('prev-title').textContent = t || '—';
    document.getElementById('prev-body').textContent  = b || '—';
  } else {
    card.classList.remove('visible');
  }
}

let _toastTimer;
function showToast(msg, type='info'){
  const t = document.getElementById('toast');
  clearTimeout(_toastTimer);
  t.className = 'show ' + type;
  t.textContent = msg;
  _toastTimer = setTimeout(()=>t.className='', 3800);
}
</script>
</body>
</html>
