<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Memive — Logo Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #080612;
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
  padding: 48px 32px;
}
h1 {
  text-align: center;
  font-size: 22px;
  letter-spacing: .12em;
  color: #a0a0c0;
  margin-bottom: 48px;
  text-transform: uppercase;
}
.grid {
  display: flex;
  flex-wrap: wrap;
  gap: 32px;
  justify-content: center;
  max-width: 1100px;
  margin: 0 auto;
}
.card {
  background: #0e0c1e;
  border: 1px solid #2a1f4a;
  border-radius: 20px;
  padding: 40px 32px 28px;
  width: 190px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  cursor: pointer;
  transition: transform .25s, border-color .25s, box-shadow .25s;
}
.card:hover {
  transform: translateY(-8px);
  border-color: #7c3aed;
  box-shadow: 0 20px 50px rgba(124,58,237,.3);
}
.card svg { display: block; }
.label {
  font-size: 11px;
  letter-spacing: .14em;
  color: #6050a0;
  text-transform: uppercase;
}
.name {
  font-size: 17px;
  font-weight: 700;
  color: #e0d8ff;
  text-align: center;
  line-height: 1.3;
}
.desc {
  font-size: 12px;
  color: #7060a0;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>
<body>
<h1>// Memive — 5 Proposte Logo</h1>
<div class="grid">

  <!-- ① Onda + Cerchio -->
  <div class="card">
    <span class="label">// 01</span>
    <svg width="90" height="90" viewBox="0 0 90 90" fill="none">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="90" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#7C3AED"/>
          <stop offset="100%" stop-color="#EC4899"/>
        </linearGradient>
        <clipPath id="c1"><circle cx="45" cy="45" r="35"/></clipPath>
      </defs>
      <!-- Cerchio outline -->
      <circle cx="45" cy="45" r="35" stroke="url(#g1)" stroke-width="4" fill="none"/>
      <!-- Onda sonora centrata, clippata nel cerchio -->
      <g clip-path="url(#c1)">
        <path d="M10 45 Q20 28 30 45 Q40 62 50 45 Q60 28 70 45 Q80 62 90 45"
              stroke="url(#g1)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>
      <!-- Punto centrale pulsante -->
      <circle cx="45" cy="45" r="4" fill="url(#g1)"/>
    </svg>
    <span class="name">Onda + Cerchio</span>
    <span class="desc">Social + voce in un'icona</span>
  </div>

  <!-- ② Mic Minimal -->
  <div class="card">
    <span class="label">// 02</span>
    <svg width="90" height="90" viewBox="0 0 90 90" fill="none">
      <defs>
        <linearGradient id="g2" x1="30" y1="10" x2="60" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#818CF8"/>
          <stop offset="100%" stop-color="#DB2777"/>
        </linearGradient>
      </defs>
      <!-- Corpo microfono -->
      <rect x="32" y="12" width="26" height="38" rx="13" fill="url(#g2)"/>
      <!-- Tacche mic -->
      <line x1="32" y1="32" x2="58" y2="32" stroke="#fff" stroke-width="1.5" stroke-opacity=".35"/>
      <line x1="32" y1="38" x2="58" y2="38" stroke="#fff" stroke-width="1.5" stroke-opacity=".35"/>
      <!-- Arco base -->
      <path d="M22 46 Q22 68 45 68 Q68 68 68 46"
            stroke="url(#g2)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Linea verticale base -->
      <line x1="45" y1="68" x2="45" y2="80" stroke="url(#g2)" stroke-width="4" stroke-linecap="round"/>
      <!-- Base piede -->
      <line x1="30" y1="80" x2="60" y2="80" stroke="url(#g2)" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="name">Mic Minimal</span>
    <span class="desc">Diretto, riconoscibile</span>
  </div>

  <!-- ③ M + Onda -->
  <div class="card">
    <span class="label">// 03</span>
    <svg width="90" height="90" viewBox="0 0 90 90" fill="none">
      <defs>
        <linearGradient id="g3" x1="0" y1="0" x2="90" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#6366F1"/>
          <stop offset="50%" stop-color="#8B5CF6"/>
          <stop offset="100%" stop-color="#EC4899"/>
        </linearGradient>
      </defs>
      <!-- Sfondo cerchio morbido -->
      <circle cx="45" cy="45" r="40" fill="rgba(99,102,241,0.12)"/>
      <!-- Lettera M stilizzata con creste = onde -->
      <path d="M14 65 L14 30 Q14 22 22 22 Q28 22 30 30 L45 55 L60 30 Q62 22 68 22 Q76 22 76 30 L76 65"
            stroke="url(#g3)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Punto basso come "." di Memive -->
      <circle cx="45" cy="76" r="4.5" fill="url(#g3)"/>
    </svg>
    <span class="name">M + Onda</span>
    <span class="desc">Brandizzato, elegante</span>
  </div>

  <!-- ④ Bolla Vocale -->
  <div class="card">
    <span class="label">// 04</span>
    <svg width="90" height="90" viewBox="0 0 90 90" fill="none">
      <defs>
        <linearGradient id="g4" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4F46E5"/>
          <stop offset="100%" stop-color="#A855F7"/>
        </linearGradient>
      </defs>
      <!-- Bolla chat con coda -->
      <path d="M15 18 Q15 12 21 12 L69 12 Q75 12 75 18 L75 56 Q75 62 69 62 L42 62 L30 76 L30 62 L21 62 Q15 62 15 56 Z"
            fill="url(#g4)"/>
      <!-- 3 barre equalizzatore dentro la bolla -->
      <rect x="29" y="30" width="6" height="20" rx="3" fill="white" opacity=".9"/>
      <rect x="42" y="24" width="6" height="26" rx="3" fill="white"/>
      <rect x="55" y="30" width="6" height="20" rx="3" fill="white" opacity=".9"/>
    </svg>
    <span class="name">Bolla Vocale</span>
    <span class="desc">Chat → voce, intuitivo</span>
  </div>

  <!-- ⑤ Spirale Sonora -->
  <div class="card">
    <span class="label">// 05</span>
    <svg width="90" height="90" viewBox="0 0 90 90" fill="none">
      <defs>
        <linearGradient id="g5a" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7C3AED"/>
          <stop offset="100%" stop-color="#00F5D4"/>
        </linearGradient>
        <linearGradient id="g5b" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#EC4899"/>
          <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>
      </defs>
      <!-- Cerchi concentrici che degradano = propagazione suono -->
      <circle cx="45" cy="45" r="38" stroke="url(#g5a)" stroke-width="2.5" fill="none" stroke-opacity=".25"/>
      <circle cx="45" cy="45" r="30" stroke="url(#g5a)" stroke-width="2.5" fill="none" stroke-opacity=".45"/>
      <circle cx="45" cy="45" r="22" stroke="url(#g5b)" stroke-width="3" fill="none" stroke-opacity=".7"/>
      <circle cx="45" cy="45" r="13" stroke="url(#g5b)" stroke-width="3.5" fill="none" stroke-opacity=".9"/>
      <!-- Nucleo pieno -->
      <circle cx="45" cy="45" r="6" fill="url(#g5b)"/>
      <!-- 4 linee direzionali -->
      <line x1="45" y1="7" x2="45" y2="2" stroke="url(#g5a)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="83" y1="45" x2="88" y2="45" stroke="url(#g5a)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="45" y1="83" x2="45" y2="88" stroke="url(#g5a)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="7" y1="45" x2="2" y2="45" stroke="url(#g5a)" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span class="name">Spirale Sonora</span>
    <span class="desc">Propagazione del suono</span>
  </div>

</div>
</body>
</html>
