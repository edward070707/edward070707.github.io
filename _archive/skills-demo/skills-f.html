<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Demo — Opzione F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080F;
    --purple: #A855F7;
    --cyan: #00F5D4;
    --pink: #EC4899;
    --amber: #F59E0B;
    --blue: #60A5FA;
  }

  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }

  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: rgba(8,8,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .back-link { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 13px; font-family: 'Space Mono', monospace; transition: color 0.2s; }
  .back-link:hover { color: var(--pink); }
  .page-title { font-size: 14px; font-family: 'Space Mono', monospace; color: rgba(255,255,255,0.7); }
  .page-title span { color: var(--pink); font-weight: 700; }
  .nav-demos { display: flex; gap: 6px; }
  .nav-demos a {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5); text-decoration: none;
    font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
    transition: all 0.2s;
  }
  .nav-demos a:hover { background: rgba(236,72,153,0.2); border-color: var(--pink); color: var(--pink); }
  .nav-demos a.active { background: rgba(236,72,153,0.3); border-color: var(--pink); color: #fff; }

  #blobCanvas {
    position: fixed;
    top: 60px; left: 0;
    width: 100%;
    height: calc(100vh - 60px);
    display: block;
  }

  /* DETAIL PANEL */
  .detail-panel {
    position: fixed;
    right: 24px;
    top: 50%;
    transform: translateY(-50%) translateX(20px);
    width: 210px;
    background: rgba(8,8,15,0.95);
    border: 1px solid rgba(236,72,153,0.3);
    border-radius: 16px;
    padding: 18px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    backdrop-filter: blur(20px);
  }
  .detail-panel.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) translateX(0);
  }
  .dp-title { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .dp-cat { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .dp-bar-wrap { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
  .dp-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s; width: 0; }
  .dp-pct { font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 700; }
  .dp-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .dp-close { position: absolute; top: 12px; right: 12px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.4); background: none; border: none; color: rgba(255,255,255,0.4); }
  .dp-close:hover { color: #fff; }

  /* CONTROLS */
  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 100;
    background: rgba(8,8,15,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 40px;
    padding: 10px 20px;
  }
  .ctrl-label { font-size: 10px; font-family: 'Space Mono', monospace; color: rgba(255,255,255,0.5); }
  input[type=range] {
    -webkit-appearance: none;
    width: 80px; height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--pink);
    cursor: pointer;
    box-shadow: 0 0 6px var(--pink);
  }
  .ctrl-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.8);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .ctrl-btn:hover { background: rgba(236,72,153,0.2); border-color: var(--pink); color: #fff; }

  /* TOOLTIP */
  .tooltip {
    position: fixed;
    background: rgba(8,8,15,0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 10px 14px;
    pointer-events: none;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.15s;
    font-size: 12px;
    backdrop-filter: blur(16px);
    min-width: 130px;
  }
  .tooltip.visible { opacity: 1; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-link">← Back</a>
  <div class="page-title">Skills Demo — <span>Opzione F</span></div>
  <nav class="nav-demos">
    <a href="skills-a.html">A</a>
    <a href="skills-b.html">B</a>
    <a href="skills-c.html">C</a>
    <a href="skills-d.html">D</a>
    <a href="skills-e.html">E</a>
    <a href="skills-f.html" class="active">F</a>
  </nav>
</div>

<canvas id="blobCanvas"></canvas>

<div class="detail-panel" id="detailPanel">
  <button class="dp-close" id="dpClose">✕</button>
  <div class="dp-title" id="dp-name"></div>
  <div class="dp-cat" id="dp-cat"></div>
  <div class="dp-bar-wrap"><div class="dp-bar-fill" id="dp-bar"></div></div>
  <div class="dp-pct" id="dp-pct"></div>
  <div class="dp-badge" id="dp-badge"></div>
</div>

<div class="controls">
  <span class="ctrl-label">SPEED</span>
  <input type="range" id="speedSlider" min="0" max="100" value="50">
  <button class="ctrl-btn" id="scatterBtn">SCATTER</button>
  <button class="ctrl-btn" id="clusterBtn">CLUSTER</button>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const SKILLS = [
  { name:'Flutter',   cat:'Mobile',  pct:85, color:'#A855F7', color2:'#7C3AED' },
  { name:'Dart',      cat:'Mobile',  pct:85, color:'#A855F7', color2:'#9333EA' },
  { name:'Swift',     cat:'Mobile',  pct:60, color:'#A855F7', color2:'#C084FC' },
  { name:'Firebase',  cat:'Mobile',  pct:78, color:'#A855F7', color2:'#8B5CF6' },
  { name:'HTML',      cat:'Web',     pct:90, color:'#00F5D4', color2:'#06B6D4' },
  { name:'CSS',       cat:'Web',     pct:90, color:'#00F5D4', color2:'#0EA5E9' },
  { name:'JS',        cat:'Web',     pct:88, color:'#00F5D4', color2:'#22D3EE' },
  { name:'Vue.js',    cat:'Web',     pct:55, color:'#00F5D4', color2:'#67E8F9' },
  { name:'Firebase',  cat:'Backend', pct:75, color:'#F59E0B', color2:'#D97706' },
  { name:'SQL',       cat:'Backend', pct:70, color:'#F59E0B', color2:'#F97316' },
  { name:'REST APIs', cat:'Backend', pct:72, color:'#F59E0B', color2:'#EF4444' },
  { name:'Node.js',   cat:'Backend', pct:50, color:'#F59E0B', color2:'#FB923C' },
  { name:'UI/UX',     cat:'Design',  pct:80, color:'#EC4899', color2:'#DB2777' },
  { name:'Figma',     cat:'Design',  pct:78, color:'#EC4899', color2:'#BE185D' },
  { name:'Motion',    cat:'Design',  pct:68, color:'#EC4899', color2:'#F472B6' },
  { name:'Branding',  cat:'Design',  pct:72, color:'#EC4899', color2:'#FB7185' },
  { name:'VS Code',   cat:'Tools',   pct:92, color:'#60A5FA', color2:'#3B82F6' },
  { name:'Git',       cat:'Tools',   pct:70, color:'#60A5FA', color2:'#2563EB' },
  { name:'Xcode',     cat:'Tools',   pct:58, color:'#60A5FA', color2:'#7C3AED' },
  { name:'Android S.',cat:'Tools',   pct:65, color:'#60A5FA', color2:'#0EA5E9' },
];

function getBadge(pct) {
  if (pct >= 85) return { label:'Expert', bg:'rgba(168,85,247,0.3)', color:'#A855F7' };
  if (pct >= 70) return { label:'Advanced', bg:'rgba(0,245,212,0.3)', color:'#00F5D4' };
  if (pct >= 55) return { label:'Proficient', bg:'rgba(245,158,11,0.3)', color:'#F59E0B' };
  return { label:'Learning', bg:'rgba(96,165,250,0.3)', color:'#60A5FA' };
}

const canvas = document.getElementById('blobCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initBlobs(); });

// Marching squares grid
const GRID = 3; // cell size in pixels
let gridW, gridH;
let field;

function setupGrid() {
  gridW = Math.ceil(W / GRID) + 2;
  gridH = Math.ceil(H / GRID) + 2;
  field = new Float32Array(gridW * gridH);
}
setupGrid();

// Blobs
let blobs = [];
let speedMult = 1;
let mouseX = -1, mouseY = -1;
let hoveredBlob = null;
let frozenBlob = null;
let clusterMode = false;

function initBlobs() {
  blobs = SKILLS.map((skill, i) => {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.4 + Math.random() * 0.6;
    return {
      x: 80 + Math.random() * (W - 160),
      y: 80 + Math.random() * (H - 160),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: skill.pct * 0.55 + 12,
      skill,
      frozen: false,
      scale: 1,
      targetScale: 1,
    };
  });
}
initBlobs();

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

// Marching squares lookup
const MS_TABLE = [0,3,0,3,12,15,12,15,0,3,0,3,12,15,12,15];

function computeField() {
  field.fill(0);
  blobs.forEach(blob => {
    const r2 = blob.r * blob.r * blob.scale * blob.scale;
    const bx = blob.x, by = blob.y;
    const minGX = Math.max(0, Math.floor((bx - blob.r*blob.scale*3) / GRID));
    const maxGX = Math.min(gridW-1, Math.ceil((bx + blob.r*blob.scale*3) / GRID));
    const minGY = Math.max(0, Math.floor((by - blob.r*blob.scale*3) / GRID));
    const maxGY = Math.min(gridH-1, Math.ceil((by + blob.r*blob.scale*3) / GRID));
    for (let gy = minGY; gy <= maxGY; gy++) {
      for (let gx = minGX; gx <= maxGX; gx++) {
        const px = gx * GRID, py = gy * GRID;
        const dx = px - bx, dy = py - by;
        const d2 = dx*dx + dy*dy;
        if (d2 < 0.0001) { field[gy*gridW+gx] += 1; continue; }
        field[gy*gridW+gx] += r2 / d2;
      }
    }
  });
}

const THRESHOLD = 1.0;

function drawBlobs() {
  ctx.clearRect(0, 0, W, H);

  // Draw background glow per blob
  blobs.forEach(blob => {
    const rgb = hexToRgb(blob.skill.color);
    const gr = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.r * blob.scale * 2.5);
    gr.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.06)`);
    gr.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
    ctx.fillStyle = gr;
    ctx.fillRect(blob.x - blob.r*blob.scale*3, blob.y - blob.r*blob.scale*3, blob.r*blob.scale*6, blob.r*blob.scale*6);
  });

  computeField();

  // For each blob group, draw the metaball shape
  // We'll use a single color pass per category by drawing with screen blending
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';

  // Build color map: for each grid cell, which blob dominates?
  // We'll draw filled circles with strong gradient to simulate liquid merging
  blobs.forEach(blob => {
    const rgb = hexToRgb(blob.skill.color);
    const rgb2 = hexToRgb(blob.skill.color2);
    const r = blob.r * blob.scale;

    // Create off-screen gradient circle to "melt" into others
    const gr = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, r * 1.3);
    gr.addColorStop(0, `rgba(${rgb2[0]},${rgb2[1]},${rgb2[2]},0.95)`);
    gr.addColorStop(0.5, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.85)`);
    gr.addColorStop(0.85, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.4)`);
    gr.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);

    ctx.beginPath();
    ctx.arc(blob.x, blob.y, r * 1.3, 0, Math.PI*2);
    ctx.fillStyle = gr;
    ctx.fill();
  });
  ctx.restore();

  // Draw outline via marching squares (simplified — just find contour edges)
  // For performance, draw a glowing border effect per blob
  blobs.forEach(blob => {
    const r = blob.r * blob.scale;
    ctx.beginPath();
    ctx.arc(blob.x, blob.y, r, 0, Math.PI*2);
    ctx.strokeStyle = blob.skill.color + 'AA';
    ctx.lineWidth = blob === hoveredBlob ? 3 : 1.5;
    if (blob === hoveredBlob) {
      ctx.shadowBlur = 20;
      ctx.shadowColor = blob.skill.color;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Name label for large enough blobs
    if (r > 28) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (r - 28) / 20);
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${Math.min(13, r * 0.25)}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.fillText(blob.skill.name, blob.x, blob.y);
      ctx.restore();
    }
  });
}

function updateBlobs(dt) {
  const cx = W / 2, cy = H / 2;
  const spd = speedMult * (document.getElementById('speedSlider').value / 50);

  blobs.forEach((blob, i) => {
    if (blob.frozen) return;

    // Cluster attraction
    if (clusterMode) {
      const dx = cx - blob.x, dy = cy - blob.y;
      const d = Math.hypot(dx, dy) + 0.001;
      blob.vx += dx / d * 0.5;
      blob.vy += dy / d * 0.5;
    }

    // Repulsion / attraction between nearby blobs
    blobs.forEach((other, j) => {
      if (i === j) return;
      const dx = blob.x - other.x;
      const dy = blob.y - other.y;
      const d = Math.hypot(dx, dy) + 0.001;
      const minD = (blob.r + other.r) * blob.scale * 0.8;
      if (d < minD) {
        const force = (minD - d) / minD * 0.08;
        blob.vx += (dx / d) * force;
        blob.vy += (dy / d) * force;
      }
    });

    // Apply velocity
    blob.x += blob.vx * spd;
    blob.y += blob.vy * spd;

    // Bounce off walls
    const margin = blob.r * blob.scale;
    if (blob.x < margin) { blob.x = margin; blob.vx = Math.abs(blob.vx); }
    if (blob.x > W - margin) { blob.x = W - margin; blob.vx = -Math.abs(blob.vx); }
    if (blob.y < margin) { blob.y = margin; blob.vy = Math.abs(blob.vy); }
    if (blob.y > H - margin) { blob.y = H - margin; blob.vy = -Math.abs(blob.vy); }

    // Speed limit
    const speed = Math.hypot(blob.vx, blob.vy);
    const maxSpeed = 2.5;
    if (speed > maxSpeed) { blob.vx /= speed / maxSpeed; blob.vy /= speed / maxSpeed; }

    // Scale lerp
    blob.scale += (blob.targetScale - blob.scale) * 0.1;
  });
}

// Hover detection
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;

  let nearest = null, minD = Infinity;
  blobs.forEach(blob => {
    const d = Math.hypot(mouseX - blob.x, mouseY - blob.y);
    if (d < minD) { minD = d; nearest = blob; }
  });

  // Set hover if within blob
  if (nearest && minD < nearest.r * nearest.scale * 1.5) {
    if (hoveredBlob !== nearest) {
      if (hoveredBlob) hoveredBlob.targetScale = 1;
      hoveredBlob = nearest;
      hoveredBlob.targetScale = 1.3;
      if (!hoveredBlob.frozen) {
        // Slow it down
        hoveredBlob.vx *= 0.3;
        hoveredBlob.vy *= 0.3;
      }
    }
    const tt = document.getElementById('tooltip');
    const b = getBadge(nearest.skill.pct);
    tt.innerHTML = `
      <div style="font-family:'Space Mono',monospace;font-weight:700;color:${nearest.skill.color};font-size:13px;">${nearest.skill.name}</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.5);margin:3px 0;">${nearest.skill.cat}</div>
      <div style="font-size:18px;font-family:'Space Mono',monospace;font-weight:700;color:${nearest.skill.color};">${nearest.skill.pct}%</div>
      <div style="display:inline-block;padding:2px 8px;border-radius:20px;background:${b.bg};color:${b.color};font-size:9px;margin-top:4px;font-weight:600;text-transform:uppercase;">${b.label}</div>
    `;
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top = (e.clientY - 10) + 'px';
    tt.classList.add('visible');
  } else {
    if (hoveredBlob) { hoveredBlob.targetScale = 1; hoveredBlob = null; }
    document.getElementById('tooltip').classList.remove('visible');
  }
});

canvas.addEventListener('mouseleave', () => {
  if (hoveredBlob) { hoveredBlob.targetScale = 1; hoveredBlob = null; }
  document.getElementById('tooltip').classList.remove('visible');
});

canvas.addEventListener('click', (e) => {
  if (!hoveredBlob) return;
  const blob = hoveredBlob;
  blob.frozen = !blob.frozen;
  if (blob.frozen) {
    blob.vx = 0; blob.vy = 0;
    frozenBlob = blob;
    const dp = document.getElementById('detailPanel');
    const b = getBadge(blob.skill.pct);
    document.getElementById('dp-name').textContent = blob.skill.name;
    document.getElementById('dp-name').style.color = blob.skill.color;
    document.getElementById('dp-cat').textContent = blob.skill.cat;
    document.getElementById('dp-bar').style.background = blob.skill.color;
    setTimeout(() => { document.getElementById('dp-bar').style.width = blob.skill.pct + '%'; }, 50);
    document.getElementById('dp-pct').textContent = blob.skill.pct + '%';
    document.getElementById('dp-pct').style.color = blob.skill.color;
    const badge = document.getElementById('dp-badge');
    badge.textContent = b.label; badge.style.background = b.bg; badge.style.color = b.color;
    dp.classList.add('visible');
  } else {
    frozenBlob = null;
    const angle = Math.random() * Math.PI * 2;
    blob.vx = Math.cos(angle) * 1;
    blob.vy = Math.sin(angle) * 1;
    document.getElementById('detailPanel').classList.remove('visible');
  }
});

document.getElementById('dpClose').addEventListener('click', () => {
  if (frozenBlob) {
    frozenBlob.frozen = false;
    const a = Math.random() * Math.PI * 2;
    frozenBlob.vx = Math.cos(a); frozenBlob.vy = Math.sin(a);
    frozenBlob = null;
  }
  document.getElementById('detailPanel').classList.remove('visible');
});

// Controls
document.getElementById('scatterBtn').addEventListener('click', () => {
  clusterMode = false;
  blobs.forEach(blob => {
    if (blob.frozen) return;
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 3;
    blob.vx = Math.cos(a) * s;
    blob.vy = Math.sin(a) * s;
  });
});

document.getElementById('clusterBtn').addEventListener('click', () => {
  clusterMode = true;
  setTimeout(() => { clusterMode = false; }, 3000);
});

let last = performance.now();
function loop(now) {
  const dt = (now - last) / 16;
  last = now;
  updateBlobs(dt);
  drawBlobs();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
