<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Demo — Opzione A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080F;
    --purple: #A855F7;
    --cyan: #00F5D4;
    --pink: #EC4899;
    --amber: #F59E0B;
    --blue: #60A5FA;
    --green: #22C55E;
  }

  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* TOP NAV */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: rgba(8,8,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .back-link {
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 13px;
    font-family: 'Space Mono', monospace;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--cyan); }

  .page-title {
    font-size: 14px;
    font-family: 'Space Mono', monospace;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.05em;
  }
  .page-title span { color: var(--purple); font-weight: 700; }

  .nav-demos {
    display: flex;
    gap: 6px;
  }
  .nav-demos a {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .nav-demos a:hover { background: rgba(168,85,247,0.2); border-color: var(--purple); color: var(--purple); }
  .nav-demos a.active { background: rgba(168,85,247,0.3); border-color: var(--purple); color: #fff; }

  /* CANVAS BG */
  #bgCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* 3D SCENE */
  .scene-wrapper {
    position: fixed;
    top: 60px; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 800px;
    cursor: grab;
  }
  .scene-wrapper:active { cursor: grabbing; }

  .scene {
    transform-style: preserve-3d;
    position: relative;
    width: 600px;
    height: 500px;
    transform: rotateX(-10deg) rotateY(0deg);
    transition: none;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
    will-change: transform;
    text-align: center;
    font-size: 11px;
    line-height: 1.2;
  }
  .orb:hover {
    z-index: 50 !important;
    box-shadow: 0 0 40px 12px currentColor, 0 0 80px 20px currentColor !important;
  }

  /* TOOLTIP */
  .tooltip {
    position: fixed;
    background: rgba(8,8,15,0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 16px;
    pointer-events: none;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s;
    font-size: 13px;
    backdrop-filter: blur(16px);
    min-width: 160px;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-name {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .tooltip-cat {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .tooltip-bar {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    margin-bottom: 4px;
    overflow: hidden;
  }
  .tooltip-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s;
  }
  .tooltip-pct {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
  }
  .tooltip-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* LEGEND */
  .legend {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    background: rgba(8,8,15,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 40px;
    padding: 10px 24px;
    z-index: 100;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: rgba(255,255,255,0.6);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  /* DRAG HINT */
  .drag-hint {
    position: fixed;
    bottom: 76px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: rgba(255,255,255,0.3);
    z-index: 100;
    animation: fadeHint 3s 2s forwards;
    opacity: 1;
  }
  @keyframes fadeHint { to { opacity: 0; } }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-link">← Back</a>
  <div class="page-title">Skills Demo — <span>Opzione A</span></div>
  <nav class="nav-demos">
    <a href="skills-a.html" class="active">A</a>
    <a href="skills-b.html">B</a>
    <a href="skills-c.html">C</a>
    <a href="skills-d.html">D</a>
    <a href="skills-e.html">E</a>
    <a href="skills-f.html">F</a>
  </nav>
</div>

<canvas id="bgCanvas"></canvas>

<div class="scene-wrapper" id="sceneWrapper">
  <div class="scene" id="scene"></div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-name" id="tt-name"></div>
  <div class="tooltip-cat" id="tt-cat"></div>
  <div class="tooltip-bar"><div class="tooltip-fill" id="tt-fill"></div></div>
  <div class="tooltip-pct" id="tt-pct"></div>
  <div class="tooltip-badge" id="tt-badge"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#A855F7"></div>Mobile</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00F5D4"></div>Web</div>
  <div class="legend-item"><div class="legend-dot" style="background:#F59E0B"></div>Backend</div>
  <div class="legend-item"><div class="legend-dot" style="background:#EC4899"></div>Design</div>
  <div class="legend-item"><div class="legend-dot" style="background:#60A5FA"></div>Tools</div>
</div>

<div class="drag-hint">✦ drag to rotate</div>

<script>
// ---- DATA ----
const SKILLS = [
  { name:'Flutter',   cat:'Mobile',  pct:85, color:'#A855F7' },
  { name:'Dart',      cat:'Mobile',  pct:85, color:'#A855F7' },
  { name:'Swift',     cat:'Mobile',  pct:60, color:'#A855F7' },
  { name:'Firebase',  cat:'Mobile',  pct:78, color:'#A855F7' },
  { name:'HTML',      cat:'Web',     pct:90, color:'#00F5D4' },
  { name:'CSS',       cat:'Web',     pct:90, color:'#00F5D4' },
  { name:'JS',        cat:'Web',     pct:88, color:'#00F5D4' },
  { name:'Vue.js',    cat:'Web',     pct:55, color:'#00F5D4' },
  { name:'Firebase',  cat:'Backend', pct:75, color:'#F59E0B' },
  { name:'SQL',       cat:'Backend', pct:70, color:'#F59E0B' },
  { name:'REST APIs', cat:'Backend', pct:72, color:'#F59E0B' },
  { name:'Node.js',   cat:'Backend', pct:50, color:'#F59E0B' },
  { name:'UI/UX',     cat:'Design',  pct:80, color:'#EC4899' },
  { name:'Figma',     cat:'Design',  pct:78, color:'#EC4899' },
  { name:'Motion',    cat:'Design',  pct:68, color:'#EC4899' },
  { name:'Branding',  cat:'Design',  pct:72, color:'#EC4899' },
  { name:'VS Code',   cat:'Tools',   pct:92, color:'#60A5FA' },
  { name:'Git',       cat:'Tools',   pct:70, color:'#60A5FA' },
  { name:'Xcode',     cat:'Tools',   pct:58, color:'#60A5FA' },
  { name:'Android S.', cat:'Tools',  pct:65, color:'#60A5FA' },
];

function getBadge(pct) {
  if (pct >= 85) return { label:'Expert', bg:'rgba(168,85,247,0.3)', color:'#A855F7' };
  if (pct >= 70) return { label:'Advanced', bg:'rgba(0,245,212,0.3)', color:'#00F5D4' };
  if (pct >= 55) return { label:'Proficient', bg:'rgba(245,158,11,0.3)', color:'#F59E0B' };
  return { label:'Learning', bg:'rgba(96,165,250,0.3)', color:'#60A5FA' };
}

// ---- PARTICLE CANVAS ----
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 1.5 + 0.5,
    alpha: Math.random() * 0.5 + 0.1
  });
}

function animateParticles() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = bgCanvas.width;
    if (p.x > bgCanvas.width) p.x = 0;
    if (p.y < 0) p.y = bgCanvas.height;
    if (p.y > bgCanvas.height) p.y = 0;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(255,255,255,${p.alpha})`;
    bgCtx.fill();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ---- BUILD ORBS ----
const scene = document.getElementById('scene');

// Distribute orbs in 3D with category clusters
const catPositions = {
  'Mobile':  { cx:-160, cy:-100 },
  'Web':     { cx: 160, cy:-100 },
  'Backend': { cx: 160, cy:  80 },
  'Design':  { cx:-160, cy:  80 },
  'Tools':   { cx:   0, cy:   0 },
};

const floatKeyframes = [];
for (let i = 0; i < 20; i++) {
  const dur = 6 + Math.random() * 8;
  const dz = 15 + Math.random() * 15;
  const dx = (Math.random() - 0.5) * 10;
  const dy = (Math.random() - 0.5) * 10;
  const kfName = `float${i}`;
  const style = document.createElement('style');
  style.textContent = `
    @keyframes ${kfName} {
      0%   { transform: translateX(var(--ox)) translateY(var(--oy)) translateZ(var(--oz)); }
      25%  { transform: translateX(calc(var(--ox) + ${dx}px)) translateY(calc(var(--oy) + ${dy}px)) translateZ(calc(var(--oz) + ${dz}px)); }
      75%  { transform: translateX(calc(var(--ox) - ${dx}px)) translateY(calc(var(--oy) - ${dy}px)) translateZ(calc(var(--oz) - ${dz}px)); }
      100% { transform: translateX(var(--ox)) translateY(var(--oy)) translateZ(var(--oz)); }
    }
  `;
  document.head.appendChild(style);
  floatKeyframes.push({ name: kfName, dur });
}

SKILLS.forEach((skill, i) => {
  const base = catPositions[skill.cat];
  const spread = 80;
  const angle = (i % 4) * (Math.PI / 2) + Math.random() * 0.5;
  const r = 30 + (i % 4) * 18;
  const ox = base.cx + Math.cos(angle) * r + (Math.random() - 0.5) * spread;
  const oy = base.cy + Math.sin(angle) * r * 0.7 + (Math.random() - 0.5) * spread * 0.7;
  const oz = (Math.random() - 0.5) * 200;

  const size = Math.round(skill.pct * 0.9 + 10);
  const kf = floatKeyframes[i];

  const orb = document.createElement('div');
  orb.className = 'orb';
  orb.dataset.idx = i;
  orb.style.cssText = `
    width: ${size}px;
    height: ${size}px;
    left: calc(50% + ${ox}px - ${size/2}px);
    top: calc(50% + ${oy}px - ${size/2}px);
    --ox: ${ox}px;
    --oy: ${oy}px;
    --oz: ${oz}px;
    background: radial-gradient(circle at 35% 35%, ${skill.color}CC, ${skill.color}44, ${skill.color}11);
    box-shadow: 0 0 ${size*0.4}px ${skill.color}66, inset 0 0 ${size*0.3}px ${skill.color}33;
    border: 1px solid ${skill.color}55;
    color: currentColor;
    z-index: ${Math.round(oz + 200)};
    font-size: ${size > 70 ? 11 : 9}px;
    animation: ${kf.name} ${kf.dur.toFixed(1)}s ease-in-out infinite;
  `;
  orb.textContent = skill.name;
  orb.style.color = '#fff';
  scene.appendChild(orb);

  // Hover effects
  orb.addEventListener('mouseenter', (e) => {
    orb.style.transform = `translateX(var(--ox)) translateY(var(--oy)) translateZ(var(--oz)) scale(1.3)`;
    orb.style.animation = 'none';
    orb.style.boxShadow = `0 0 ${size}px ${skill.color}, 0 0 ${size*2}px ${skill.color}88`;
    showTooltip(e, skill);
  });
  orb.addEventListener('mouseleave', () => {
    orb.style.transform = '';
    orb.style.animation = `${kf.name} ${kf.dur.toFixed(1)}s ease-in-out infinite`;
    orb.style.boxShadow = `0 0 ${size*0.4}px ${skill.color}66, inset 0 0 ${size*0.3}px ${skill.color}33`;
    hideTooltip();
  });
  orb.addEventListener('mousemove', updateTooltipPos);
});

// ---- TOOLTIP ----
const tooltip = document.getElementById('tooltip');
function showTooltip(e, skill) {
  const b = getBadge(skill.pct);
  document.getElementById('tt-name').textContent = skill.name;
  document.getElementById('tt-name').style.color = skill.color;
  document.getElementById('tt-cat').textContent = skill.cat;
  document.getElementById('tt-fill').style.background = skill.color;
  document.getElementById('tt-fill').style.width = skill.pct + '%';
  document.getElementById('tt-pct').textContent = skill.pct + '%';
  document.getElementById('tt-pct').style.color = skill.color;
  const badge = document.getElementById('tt-badge');
  badge.textContent = b.label;
  badge.style.background = b.bg;
  badge.style.color = b.color;
  tooltip.classList.add('visible');
  updateTooltipPos(e);
}
function updateTooltipPos(e) {
  tooltip.style.left = (e.clientX + 16) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
}
function hideTooltip() {
  tooltip.classList.remove('visible');
}

// ---- 3D DRAG ----
const sceneWrapper = document.getElementById('sceneWrapper');
let isDragging = false;
let startX, startY;
let rotX = -10, rotY = 0;
let targetRotX = -10, targetRotY = 0;
let currentRotX = -10, currentRotY = 0;
let autoRotate = true;
let lastDragTime = 0;

sceneWrapper.addEventListener('mousedown', e => {
  if (e.target.classList.contains('orb')) return;
  isDragging = true;
  autoRotate = false;
  startX = e.clientX;
  startY = e.clientY;
  lastDragTime = Date.now();
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  targetRotY = rotY + dx * 0.4;
  targetRotX = rotX + dy * 0.2;
  targetRotX = Math.max(-35, Math.min(35, targetRotX));
});
window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    rotX = targetRotX;
    rotY = targetRotY;
    // Resume auto-rotate after 2s
    setTimeout(() => { autoRotate = true; }, 2000);
  }
});

// Touch support
sceneWrapper.addEventListener('touchstart', e => {
  if (e.target.classList.contains('orb')) return;
  autoRotate = false;
  isDragging = true;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, { passive: true });
sceneWrapper.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;
  targetRotY = rotY + dx * 0.4;
  targetRotX = rotX + dy * 0.2;
  targetRotX = Math.max(-35, Math.min(35, targetRotX));
}, { passive: true });
sceneWrapper.addEventListener('touchend', () => {
  isDragging = false;
  rotX = targetRotX;
  rotY = targetRotY;
  setTimeout(() => { autoRotate = true; }, 2000);
});

// Lerp loop
function lerp(a, b, t) { return a + (b - a) * t; }
let autoAngle = 0;

function renderLoop() {
  if (autoRotate && !isDragging) {
    autoAngle += 0.15;
    targetRotY = rotY + autoAngle * 0.08;
  }
  currentRotX = lerp(currentRotX, targetRotX, 0.08);
  currentRotY = lerp(currentRotY, targetRotY, 0.08);
  scene.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
  requestAnimationFrame(renderLoop);
}
renderLoop();
</script>
</body>
</html>
