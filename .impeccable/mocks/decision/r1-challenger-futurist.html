<!doctype html><html><head><meta charset="utf-8"><title>Libro imbullonato</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1440px;height:900px;overflow:hidden;background:#F2EDE2;color:#111;font-family:'Anton',sans-serif;position:relative}
.bolt{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4F6F8,#B7BDC3 45%,#7D848B);box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 4px 8px rgba(0,0,0,.2)}
.bolt:after{content:'';position:absolute;left:12px;right:12px;top:25px;height:6px;background:#6b7178;border-radius:3px;transform:rotate(-25deg)}
.w1{position:absolute;left:90px;top:120px;font-size:250px;line-height:.85;transform:rotate(-12deg);transform-origin:left}
.w2{position:absolute;left:220px;top:380px;font-size:200px;line-height:.85;color:#D7261E;transform:rotate(-12deg);transform-origin:left}
.w3{position:absolute;right:120px;top:120px;font-size:90px;transform:rotate(14deg)}
.w4{position:absolute;right:220px;top:300px;font-size:64px;transform:rotate(-8deg)}
.sub{position:absolute;left:100px;bottom:120px;font-family:'Hanken Grotesk';font-weight:800;font-size:30px;letter-spacing:.12em}
.btn{position:absolute;right:120px;bottom:110px;display:flex;align-items:center;gap:16px;padding:18px 38px 18px 18px;background:#D7261E;color:#fff;font-size:36px;transform:rotate(-4deg);box-shadow:6px 6px 0 #111}
.btn .bolt{position:static;width:40px;height:40px}
</style></head><body>
<div class="bolt" style="left:40px;top:40px"></div><div class="bolt" style="left:40px;bottom:40px"></div>
<div class="w1">EDWARD</div><div class="w2">ATTUATI</div>
<div class="w3">BUILD!</div><div class="w4">SHIP · SHIP</div>
<div class="sub">MOBILE &amp; WEB DEVELOPER · BRESCIA</div>
<div class="btn"><span class="bolt"></span>CONTATTAMI</div>
</body></html>
