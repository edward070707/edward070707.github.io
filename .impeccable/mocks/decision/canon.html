<!doctype html><html><head><meta charset="utf-8"><title>Standard</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1440px;height:900px;overflow:hidden;background:#FAF9F6;color:#18181B;font-family:'Geist',sans-serif;position:relative}
nav{position:absolute;top:36px;left:96px;right:96px;display:flex;justify-content:space-between;font-size:22px;font-weight:600}
nav span+span{margin-left:28px}
h1{position:absolute;left:96px;top:150px;font-size:110px;font-weight:700;letter-spacing:-.03em;line-height:1}
.sub{position:absolute;left:100px;top:290px;font-size:30px;color:#52525B}
.btns{position:absolute;left:100px;top:360px;display:flex;gap:14px}
.b{padding:16px 30px;border-radius:999px;font-size:22px;font-weight:600;border:1px solid #d4d4d8}
.b.p{background:#2F5FD0;color:#fff;border-color:#2F5FD0}
.cards{position:absolute;left:96px;right:96px;top:500px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.c{height:320px;border-radius:20px;background:#fff;border:1px solid #e7e5e4;padding:28px;font-size:30px;font-weight:700}
</style></head><body>
<nav><div>Edward Attuati</div><div><span>Progetti</span><span>Percorso</span><span>Contatti</span></div></nav>
<h1>Edward Attuati</h1>
<div class="sub">Mobile &amp; web developer. Flutter, Firebase, iOS.</div>
<div class="btns"><div class="b p">Contattami</div><div class="b">Vedi i progetti</div></div>
<div class="cards"><div class="c">Chrono</div><div class="c">Memive</div><div class="c">Scadoo</div></div>
</body></html>
