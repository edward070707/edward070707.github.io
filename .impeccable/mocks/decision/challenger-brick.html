<!doctype html><html><head><meta charset="utf-8"><title>Istruzioni</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1440px;height:900px;overflow:hidden;background:#AEDDF7;color:#111;font-family:'Archivo Black',sans-serif;position:relative;
 background-image:radial-gradient(#8ec6e6 3px,transparent 3.5px);background-size:48px 48px}
.step{position:absolute;left:80px;top:40px;font-size:300px;line-height:1}
h1{position:absolute;left:90px;top:400px;font-size:96px;line-height:1}
.sub{position:absolute;left:94px;top:520px;font-size:30px}
.inv{position:absolute;right:80px;top:70px;width:520px;height:330px;background:#fff;border:4px solid #111;border-radius:18px;padding:26px}
.inv h3{font-size:28px;margin-bottom:18px}
.p{display:inline-flex;align-items:center;gap:12px;margin:0 22px 18px 0;font-size:24px}
.b{width:70px;height:42px;border-radius:6px;border:3px solid #111;position:relative}
.b:before,.b:after{content:'';position:absolute;top:-12px;width:20px;height:10px;border:3px solid #111;border-bottom:none;border-radius:4px 4px 0 0;background:inherit}
.b:before{left:8px}.b:after{right:8px}
.arrow{position:absolute;right:300px;top:430px;width:0;height:190px;border-left:6px dashed #111}
.arrow:after{content:'';position:absolute;left:-17px;bottom:-14px;border:14px solid transparent;border-top:22px solid #111}
.base{position:absolute;right:150px;top:660px;width:440px;height:70px;background:#D9D9D9;border:4px solid #111;border-radius:8px}
.btns{position:absolute;left:90px;top:620px;display:flex;gap:16px}
.glass{padding:16px 32px;border-radius:999px;font-size:26px;background:rgba(255,255,255,.4);border:2px solid rgba(17,17,17,.6);backdrop-filter:blur(10px)}
.glass.red{background:#E0392F;color:#fff;border-color:#111}
</style></head><body>
<div class="step">01</div>
<h1>EDWARD<br>ATTUATI</h1>
<div class="sub">Mobile &amp; Web Developer</div>
<div class="btns"><div class="glass red">Contattami</div><div class="glass">Le mie app</div></div>
<div class="inv"><h3>PEZZI · 1:1</h3>
<span class="p"><span class="b" style="background:#E0392F"></span>Flutter ×1</span><span class="p"><span class="b" style="background:#FFCB05"></span>Firebase ×1</span>
<span class="p"><span class="b" style="background:#fff"></span>Dart ×2</span><span class="p"><span class="b" style="background:#2F6FD8"></span>Swift ×1</span></div>
<div class="arrow"></div><div class="base"></div>
</body></html>
