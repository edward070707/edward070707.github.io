<!doctype html><html><head><meta charset="utf-8"><title>La Tavola</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1440px;height:900px;overflow:hidden;background:#F1ECE1;color:#2E2E2C;font-family:'Archivo Narrow',sans-serif;position:relative}
.frame{position:absolute;inset:28px;border:3px solid #2E2E2C}
.frame2{position:absolute;inset:40px;border:1px solid #2E2E2C}
h1{position:absolute;left:96px;top:110px;font-size:132px;font-weight:700;letter-spacing:.04em;line-height:.95}
.sub{position:absolute;left:100px;top:380px;font-size:30px;font-weight:500;letter-spacing:.06em}
.atom{position:absolute;right:170px;top:120px;width:420px;height:420px}
.dim{position:absolute;right:170px;top:575px;width:420px;border-top:2px solid #2B4C8C}
.dim:before,.dim:after{content:'';position:absolute;top:-12px;width:2px;height:22px;background:#2B4C8C}
.dim:before{left:0}.dim:after{right:0}
.dimt{position:absolute;right:340px;top:590px;font-family:'IBM Plex Mono';font-size:24px;color:#2B4C8C}
.btns{position:absolute;left:100px;top:470px;display:flex;gap:16px}
.glass{padding:16px 30px;border-radius:999px;font-size:24px;font-weight:700;letter-spacing:.04em;
 background:rgba(255,255,255,.35);border:1px solid rgba(46,46,44,.35);box-shadow:inset 0 1px 0 #fff,0 8px 24px rgba(46,46,44,.10);backdrop-filter:blur(12px)}
.red{position:absolute;left:470px;top:455px;width:210px;height:90px;border:3px solid #C2402F;border-radius:50%;transform:rotate(-6deg)}
.redt{position:absolute;left:700px;top:470px;color:#C2402F;font-size:28px;font-weight:700;transform:rotate(-4deg)}
.cart{position:absolute;right:40px;bottom:40px;width:620px;height:200px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;border-left:2px solid #2E2E2C;border-top:2px solid #2E2E2C}
.cart div{border-right:1px solid #2E2E2C;border-bottom:1px solid #2E2E2C;padding:12px 14px;font-size:22px;font-weight:700}
.cart .w{grid-column:span 2}
</style></head><body>
<div class="frame"></div><div class="frame2"></div>
<h1>EDWARD<br>ATTUATI</h1>
<div class="sub">MOBILE &amp; WEB DEVELOPER · ING. INFORMATICA</div>
<div class="btns"><div class="glass">PROGETTI</div><div class="glass">CONTATTAMI</div></div>
<div class="red"></div><div class="redt">da vedere →</div>
<svg class="atom" viewBox="0 0 420 420"><g fill="none" stroke="#2E2E2C" stroke-width="2.5"><ellipse cx="210" cy="210" rx="190" ry="70"/><ellipse cx="210" cy="210" rx="190" ry="70" transform="rotate(60 210 210)"/><ellipse cx="210" cy="210" rx="190" ry="70" transform="rotate(-60 210 210)"/></g><circle cx="210" cy="210" r="26" fill="none" stroke="#2E2E2C" stroke-width="2.5"/><line x1="210" y1="10" x2="210" y2="410" stroke="#2B4C8C" stroke-dasharray="14 6 3 6"/><line x1="10" y1="210" x2="410" y2="210" stroke="#2B4C8C" stroke-dasharray="14 6 3 6"/></svg>
<div class="dim"></div><div class="dimt">Ø 380</div>
<div class="cart"><div class="w">DISEGNATO DA E. ATTUATI</div><div>SCALA 1:1</div><div>TAVOLA 01/05</div><div>DATA 2026</div><div>UNIBS</div></div>
</body></html>
