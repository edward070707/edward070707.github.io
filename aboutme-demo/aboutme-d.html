<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me D — Costellazione</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#030612;min-height:100vh;font-family:'Inter',sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
canvas#sky{position:absolute;inset:0;width:100%;height:100%;}

/* NAV */
nav{position:fixed;top:20px;left:24px;right:24px;z-index:100;display:flex;justify-content:space-between;align-items:center;}
.nav-back{padding:9px 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:30px;color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;backdrop-filter:blur(10px);transition:.2s;}
.nav-back:hover{background:rgba(255,255,255,.12);}
#lang-switcher{position:relative;}
#lang-current{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:30px;cursor:pointer;font-size:18px;padding:6px 12px;display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.8);backdrop-filter:blur(10px);}
#lang-dropdown{display:none;position:absolute;top:calc(100%+6px);right:0;background:rgba(5,8,25,.97);border:1px solid rgba(255,255,255,.12);border-radius:12px;overflow:hidden;z-index:200;min-width:140px;}
#lang-switcher:hover #lang-dropdown{display:block;}
#lang-dropdown button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:9px 14px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.7);transition:.15s;}
#lang-dropdown button:hover{background:rgba(255,255,255,.08);}
#lang-dropdown button.active{color:#fff;font-weight:700;}

/* Overlay UI */
.overlay{position:relative;z-index:10;text-align:center;pointer-events:none;}
.tag{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#d4af37;margin-bottom:10px;display:block;}
h2{font-family:'Playfair Display',serif;font-size:clamp(40px,6vw,64px);color:#fff;line-height:1.05;margin-bottom:8px;text-shadow:0 0 40px rgba(212,175,55,.12);}
.sub{font-size:13px;color:rgba(255,255,255,.35);letter-spacing:.5px;}

/* Tooltip */
#tooltip{position:fixed;background:rgba(5,8,25,.94);border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:14px 18px;pointer-events:none;z-index:100;max-width:210px;transition:opacity .2s;opacity:0;backdrop-filter:blur(10px);}
#tooltip h4{color:#d4af37;font-size:13px;font-weight:700;margin-bottom:5px;}
#tooltip p{color:rgba(255,255,255,.6);font-size:12px;line-height:1.5;}
#tooltip .stars{margin-top:8px;color:#d4af37;font-size:11px;letter-spacing:2px;}

/* Bottom filter bar */
.filter-bar{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.f-btn{background:rgba(5,8,25,.7);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:7px 16px;font-size:11px;color:rgba(255,255,255,.45);cursor:pointer;transition:.3s;display:flex;align-items:center;gap:6px;backdrop-filter:blur(10px);}
.f-btn:hover,.f-btn.on{background:rgba(212,175,55,.12);border-color:rgba(212,175,55,.4);color:#d4af37;}
.f-dot{width:7px;height:7px;border-radius:50%;}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<nav>
  <a class="nav-back" href="../aboutme.html">← About Me</a>
  <div id="lang-switcher">
    <button id="lang-current"><span id="lang-flag">🇬🇧</span><span style="font-size:9px;opacity:.5;">▼</span></button>
    <div id="lang-dropdown">
      <button onclick="setLang('en')" data-lang="en" class="active">🇬🇧 English</button>
      <button onclick="setLang('it')" data-lang="it">🇮🇹 Italiano</button>
      <button onclick="setLang('es')" data-lang="es">🇪🇸 Español</button>
    </div>
  </div>
</nav>

<div class="overlay">
  <span class="tag" id="tagEl">About Me</span>
  <h2>Edward Attuati</h2>
  <p class="sub" id="subEl">Hover stars to explore · Filter by category</p>
</div>

<div id="tooltip">
  <h4 id="tt-name"></h4>
  <p id="tt-desc"></p>
  <div class="stars" id="tt-stars"></div>
</div>

<div class="filter-bar" id="filterBar">
  <button class="f-btn on" data-cat="all"><span class="f-dot" style="background:#fff"></span><span id="fAll">All</span></button>
  <button class="f-btn" data-cat="code"><span class="f-dot" style="background:#4fc3f7"></span><span id="fCode">Code</span></button>
  <button class="f-btn" data-cat="design"><span class="f-dot" style="background:#ce93d8"></span><span id="fDesign">Design</span></button>
  <button class="f-btn" data-cat="edu"><span class="f-dot" style="background:#80cbc4"></span><span id="fEdu">Education</span></button>
  <button class="f-btn" data-cat="soft"><span class="f-dot" style="background:#ffb74d"></span><span id="fSoft">Soft Skills</span></button>
</div>

<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight;
const W=canvas.width,H=canvas.height;

// All skills/traits as stars (relative positions)
const SKILLS_DATA={
  en:[
    // Code
    {name:'JavaScript',cat:'code',x:.42,y:.38,r:11,level:4,desc:'Web scripting, DOM, animations',color:'#4fc3f7'},
    {name:'HTML/CSS',cat:'code',x:.52,y:.30,r:12,level:5,desc:'Markup, styling, responsive design',color:'#4fc3f7'},
    {name:'Flutter',cat:'code',x:.35,y:.45,r:10,level:4,desc:'Cross-platform mobile app development',color:'#4fc3f7'},
    {name:'Python',cat:'code',x:.60,y:.42,r:10,level:3,desc:'Scripting, algorithms, data',color:'#4fc3f7'},
    {name:'C/C++',cat:'code',x:.65,y:.33,r:9,level:3,desc:'Systems programming, university',color:'#4fc3f7'},
    {name:'Firebase',cat:'code',x:.28,y:.38,r:9,level:4,desc:'Auth, Firestore, Hosting',color:'#4fc3f7'},
    {name:'SQL',cat:'code',x:.70,y:.48,r:8,level:2,desc:'Database queries and design',color:'#4fc3f7'},
    // Design
    {name:'UI/UX',cat:'design',x:.22,y:.55,r:10,level:4,desc:'Figma, wireframes, design systems',color:'#ce93d8'},
    {name:'Figma',cat:'design',x:.15,y:.44,r:9,level:4,desc:'Prototyping and visual design',color:'#ce93d8'},
    {name:'Animation',cat:'design',x:.18,y:.33,r:8,level:3,desc:'CSS animations, microinteractions',color:'#ce93d8'},
    // Education
    {name:'UniBS',cat:'edu',x:.48,y:.62,r:11,level:5,desc:'Università di Brescia · Comp. Eng.',color:'#80cbc4'},
    {name:'Don Milani',cat:'edu',x:.38,y:.68,r:9,level:5,desc:'Liceo classico · Romano di Lombardia',color:'#80cbc4'},
    {name:'Soluzione1',cat:'edu',x:.58,y:.66,r:9,level:4,desc:'IT Internship · 2024 · Ghisalba',color:'#80cbc4'},
    // Soft
    {name:'Problem Solving',cat:'soft',x:.75,y:.58,r:11,level:5,desc:'Finding creative solutions fast',color:'#ffb74d'},
    {name:'Teamwork',cat:'soft',x:.80,y:.45,r:9,level:4,desc:'Collaboration in professional teams',color:'#ffb74d'},
    {name:'English B2',cat:'soft',x:.82,y:.33,r:8,level:3,desc:'Professional working level',color:'#ffb74d'},
  ],
  it:[
    {name:'JavaScript',cat:'code',x:.42,y:.38,r:11,level:4,desc:'Scripting web, DOM, animazioni',color:'#4fc3f7'},
    {name:'HTML/CSS',cat:'code',x:.52,y:.30,r:12,level:5,desc:'Markup, stile, design responsive',color:'#4fc3f7'},
    {name:'Flutter',cat:'code',x:.35,y:.45,r:10,level:4,desc:'Sviluppo app mobile cross-platform',color:'#4fc3f7'},
    {name:'Python',cat:'code',x:.60,y:.42,r:10,level:3,desc:'Scripting, algoritmi, dati',color:'#4fc3f7'},
    {name:'C/C++',cat:'code',x:.65,y:.33,r:9,level:3,desc:'Programmazione di sistema, università',color:'#4fc3f7'},
    {name:'Firebase',cat:'code',x:.28,y:.38,r:9,level:4,desc:'Auth, Firestore, Hosting',color:'#4fc3f7'},
    {name:'SQL',cat:'code',x:.70,y:.48,r:8,level:2,desc:'Query e progettazione database',color:'#4fc3f7'},
    {name:'UI/UX',cat:'design',x:.22,y:.55,r:10,level:4,desc:'Figma, wireframe, design system',color:'#ce93d8'},
    {name:'Figma',cat:'design',x:.15,y:.44,r:9,level:4,desc:'Prototipazione e design visivo',color:'#ce93d8'},
    {name:'Animazione',cat:'design',x:.18,y:.33,r:8,level:3,desc:'Animazioni CSS, microinterazioni',color:'#ce93d8'},
    {name:'UniBS',cat:'edu',x:.48,y:.62,r:11,level:5,desc:'Università di Brescia · Ing. Informatica',color:'#80cbc4'},
    {name:'Don Milani',cat:'edu',x:.38,y:.68,r:9,level:5,desc:'Liceo · Romano di Lombardia',color:'#80cbc4'},
    {name:'Soluzione1',cat:'edu',x:.58,y:.66,r:9,level:4,desc:'Stage IT · 2024 · Ghisalba',color:'#80cbc4'},
    {name:'Problem Solving',cat:'soft',x:.75,y:.58,r:11,level:5,desc:'Trovare soluzioni creative rapidamente',color:'#ffb74d'},
    {name:'Teamwork',cat:'soft',x:.80,y:.45,r:9,level:4,desc:'Collaborazione in team professionali',color:'#ffb74d'},
    {name:'Inglese B2',cat:'soft',x:.82,y:.33,r:8,level:3,desc:'Livello professionale',color:'#ffb74d'},
  ],
};
SKILLS_DATA.es=SKILLS_DATA.en;

const LINES=[
  [0,1],[0,2],[1,2],[0,3],[3,4],[3,6],[2,5],
  [7,8],[8,9],
  [10,11],[10,12],
  [13,14],[14,15],
  [1,10],[2,7],[13,3],
];

const bgStars=Array.from({length:280},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*.8+.2,a:Math.random()*.45+.05,s:Math.random()*.003+.001}));

let skills=[],mx=W/2,my=H/2,hovered=null,activeFilter='all',t=0;
function buildSkills(lang){
  skills=(SKILLS_DATA[lang]||SKILLS_DATA.en).map(s=>({...s,px:s.x*W,py:s.y*H,glow:Math.random()*Math.PI*2}));
}
buildSkills('en');

canvas.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  hovered=null;
  skills.forEach(s=>{if(activeFilter!=='all'&&s.cat!==activeFilter)return;if(Math.hypot(e.clientX-s.px,e.clientY-s.py)<s.r+14)hovered=s;});
  const tt=document.getElementById('tooltip');
  if(hovered){
    document.getElementById('tt-name').textContent=hovered.name;
    document.getElementById('tt-desc').textContent=hovered.desc;
    document.getElementById('tt-stars').textContent='★'.repeat(hovered.level)+'☆'.repeat(5-hovered.level);
    tt.style.opacity='1';tt.style.left=(e.clientX+16)+'px';tt.style.top=(e.clientY-8)+'px';
  } else tt.style.opacity='0';
  canvas.style.cursor=hovered?'pointer':'default';
});

function draw(){
  ctx.clearRect(0,0,W,H);t+=.016;
  ctx.fillStyle='#030612';ctx.fillRect(0,0,W,H);
  bgStars.forEach(s=>{s.a=.05+Math.sin(t*s.s*8+s.x)*.1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a})`;ctx.fill();});
  // Nebula
  const nb=ctx.createRadialGradient(W*.45,H*.45,0,W*.45,H*.45,W*.3);nb.addColorStop(0,'rgba(40,15,80,.05)');nb.addColorStop(1,'transparent');ctx.fillStyle=nb;ctx.fillRect(0,0,W,H);
  // Lines
  LINES.forEach(([a,b])=>{
    if(a>=skills.length||b>=skills.length)return;
    const sa=skills[a],sb=skills[b];
    const vis=activeFilter==='all'||sa.cat===activeFilter||sb.cat===activeFilter;
    const isHov=hovered&&(hovered.name===sa.name||hovered.name===sb.name);
    ctx.beginPath();ctx.moveTo(sa.px,sa.py);ctx.lineTo(sb.px,sb.py);
    ctx.strokeStyle=`rgba(212,175,55,${vis?(isHov?.28:.07):.02})`;ctx.lineWidth=isHov?1.5:.7;ctx.stroke();
  });
  if(hovered){ctx.beginPath();ctx.moveTo(hovered.px,hovered.py);ctx.lineTo(mx,my);ctx.strokeStyle='rgba(212,175,55,.1)';ctx.lineWidth=1;ctx.setLineDash([4,8]);ctx.stroke();ctx.setLineDash([]);}
  skills.forEach(s=>{
    const vis=activeFilter==='all'||s.cat===activeFilter;
    const isHov=hovered&&hovered.name===s.name;
    s.glow+=.022;
    const pulse=Math.sin(s.glow)*.28+.72;
    const alpha=vis?1:.1;
    if(vis){const g=ctx.createRadialGradient(s.px,s.py,0,s.px,s.py,(isHov?s.r*3.5:s.r*2.5)*pulse);const rgb=hexRgb(s.color);g.addColorStop(0,`rgba(${rgb},${isHov?.48:.18})`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.px,s.py,(isHov?s.r*3.5:s.r*2.5)*pulse,0,Math.PI*2);ctx.fill();}
    ctx.beginPath();ctx.arc(s.px,s.py,isHov?s.r*1.3:s.r,0,Math.PI*2);ctx.fillStyle=vis?s.color:'rgba(255,255,255,.06)';ctx.globalAlpha=alpha;ctx.fill();ctx.globalAlpha=1;
    if(vis&&(isHov||s.r>=10)){ctx.fillStyle=isHov?'#fff':`rgba(255,255,255,${alpha*.7})`;ctx.font=`${isHov?'600 ':'400 '}${isHov?13:10}px Inter`;ctx.textAlign='center';ctx.fillText(s.name,s.px,s.py+s.r+15);}
  });
  requestAnimationFrame(draw);
}
draw();

function hexRgb(h){return`${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;}

document.querySelectorAll('.f-btn').forEach(b=>{
  b.addEventListener('click',()=>{activeFilter=b.dataset.cat;document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
});
window.addEventListener('resize',()=>{canvas.width=innerWidth;canvas.height=innerHeight;skills.forEach(s=>{s.px=s.x*innerWidth;s.py=s.y*innerHeight;});});

// i18n
const LABELS={en:{tag:'About Me',sub:'Hover stars to explore · Filter by category',all:'All',code:'Code',design:'Design',edu:'Education',soft:'Soft Skills'},it:{tag:'Chi Sono',sub:'Hover sulle stelle · Filtra per categoria',all:'Tutte',code:'Codice',design:'Design',edu:'Formazione',soft:'Soft Skills'},es:{tag:'Sobre Mí',sub:'Hover sobre estrellas · Filtra por categoría',all:'Todas',code:'Código',design:'Diseño',edu:'Formación',soft:'Soft Skills'}};
const FLAGS={en:'🇬🇧',it:'🇮🇹',es:'🇪🇸'};
function setLang(l){
  const lb=LABELS[l]||LABELS.en;
  document.getElementById('tagEl').textContent=lb.tag;
  document.getElementById('subEl').textContent=lb.sub;
  document.getElementById('fAll').textContent=lb.all;
  document.getElementById('fCode').textContent=lb.code;
  document.getElementById('fDesign').textContent=lb.design;
  document.getElementById('fEdu').textContent=lb.edu;
  document.getElementById('fSoft').textContent=lb.soft;
  document.getElementById('lang-flag').textContent=FLAGS[l];
  document.querySelectorAll('#lang-dropdown button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  buildSkills(l);localStorage.setItem('ea-lang',l);
}
setLang(localStorage.getItem('ea-lang')||'en');
</script>
</body>
</html>
